apiVersion: apps/v1
kind: Deployment
metadata:
  name: boom-ott-web-deployment
  namespace: {{ .Values.namespace | default .Release.Namespace }}
  labels:
    app: boom-ott-web
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: boom-ott-web
  template:
    metadata:
      labels:
        app: boom-ott-web
    spec:
      initContainers:
      - name: init-public
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        command: ['sh', '-c', 'cp -a /var/www/public/. /shared-public/']
        volumeMounts:
        - name: shared-public
          mountPath: /shared-public
      containers:
      
      - name: php-fpm
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        ports:
        - containerPort: 9000

      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: shared-public
          mountPath: /var/www/public
      volumes:
      - name: nginx-conf
        configMap:
          name: boom-ott-nginx-conf
      - name: shared-public
        emptyDir: {}