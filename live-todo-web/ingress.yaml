apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: live-todo-ingress
spec:
  ingressClassName: nginx
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: live-todo
            port:
              number: 80